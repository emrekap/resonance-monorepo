# The corpus sampling frame (spec §5d).
#
# Hand-curated, committed, and deliberately NOT discovered: search.list costs
# 100 quota units against playlistItems.list's 1, and "here is our frame and
# why each channel is in it" survives diligence in a way "search returned
# these" does not.
#
# Target: ~40 channels x ~40 Shorts ~= 1,600 posts, spanning niche, format and
# subscriber tier — comfortably above the prereg floor of >=30 creators with
# >=20 posts each.
#
# Curation criteria, in order of how easy they are to get wrong:
#
#   1. VARIANCE. A channel whose Shorts all perform within a narrow band
#      contributes nothing — there is no ordering to rank. Check the channel's
#      recent Shorts view counts actually spread before adding it. No automated
#      discovery can check this, which is why the frame is curated at all.
#   2. VOLUME. >=20 Shorts under 30 seconds already published.
#   3. CADENCE. Still posting, so the daily poll has new posts to mature.
#   4. NOT A REPOST ACCOUNT. Compilations and reuploads attribute someone
#      else's content to this creator.
#   5. SPREAD. Vary niche and subscriber tier across the frame. Record the
#      frame's remaining biases in the report rather than leaving them implicit.
#
# `id` is the channelId (UC + 22 characters) from youtube.com/channel/<id> —
# NOT the @handle, which resolves to a different traversal.
#
# `loadSeeds()` throws "the sampling frame is empty" rather than polling
# nothing quietly, so the poller cannot start against a frame nobody chose.
#
#   - id: UCxxxxxxxxxxxxxxxxxxxxxx
#     handle: "@example"
#     niche: cooking
#     tier: mid
#     rationale: "Posts 3-5 Shorts a week with visibly variable reach; not a repost account."
#
# ─── What the first real polls taught us ──────────────────────────────────────
#
# The <=30 s rule is FAR stricter than "posts Shorts", and it is the binding
# constraint on frame size. Measured yields from one page of 50 recent uploads:
#
#   Mrwhosetheboss  2%     Mark Rober      4%     Doctor Mike     4%
#   Joshua Weissman 12%    Ayhan Sicimoglu 15%    Explored Travel 42%
#   Zach King       72%    Ryan HD         96%
#
# Established long-form channels post 30-60 s Shorts and mostly fail the rule;
# Shorts-NATIVE creators pass it. So screen a candidate on its count of clips
# UNDER 30 SECONDS, never on its subscriber count or its Shorts tab.
#
# Two traps worth naming, both of which look fine on a channel page:
#   * Cooking With Lynja screens at 28% yield and 12x spread — and has not
#     posted a qualifying clip in 948 DAYS. Dead channels mature no labels.
#   * Steve Mould and Mrwhosetheboss both score a 1.0x view spread across
#     their qualifying clips. Uniform reach means no ordering to rank, which
#     is the one defect that makes a channel worth exactly nothing here.
#
# The `tier` values below read: nano <10k, micro 10k-100k, mid 100k-1M,
# large >1M.
#
# KNOWN BIAS, recorded rather than left implicit (criterion 5). After batch 3
# (2026-08-15) the frame is 13 nano + 6 micro + 2 mid + 5 large. What it still
# cannot claim: (a) the MID tier (100k-1M) is the thin one now, at 2; (b) the
# nano/micro additions skew South/Southeast Asian gardening-fitness-art,
# because that is who a recent-uploads probe surfaces posting <=30 s daily —
# Western nano creators mostly post 30-60 s; (c) gardening is the largest
# single niche at 7 channels. Within-creator ranking blunts (b) and (c), but
# any cross-channel claim must carry them. Still ~14 short of the ~40 target.

