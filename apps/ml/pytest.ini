[pytest]
testpaths = tests
asyncio_mode = auto

# Both markers are deselected by `addopts` below. A bare `pytest` must never
# need a daemon or a GPU — that is what makes it safe to run in CI and on a
# laptop. A command-line `-m` overrides the one in addopts, so
# `pytest -m integration` selects them.
markers =
    integration: needs a running Redis (bun run docker:local)
    gpu: needs the real TRIBE model and a GPU

addopts = -q --strict-markers -m "not integration and not gpu"
