name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ml:
    name: apps/ml (pytest)
    runs-on: ubuntu-latest
    environment: test
    defaults:
      run:
        working-directory: apps/ml
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/ml/requirements-dev.txt

      # Deliberately NOT requirements.txt. That file pins torch from PyTorch's
      # index and installs tribev2 from git — gigabytes, for a suite that must
      # not touch either. Installing only this file is itself the test: if a
      # tested module grows a module-scope `import torch`, this job goes red,
      # which is exactly what should happen.
      - run: pip install -r requirements-dev.txt

      # `integration` (needs Redis) and `gpu` (needs the real model) are
      # deselected by pytest.ini's addopts. Everything else runs here.
      - run: python -m pytest

  node:
    name: turbo (typecheck + test)
    runs-on: ubuntu-latest
    env:
      DIRECT_DATABASE_URL: ${{secrets.TEST_DIRECT_DATABASE_URL}}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # `bunx turbo`, not `bun run test` — the root `test` script also runs the
      # Python suite, which lives in the `ml` job above and has no venv here.
      # `typecheck` builds apps/api's AppType d.ts first via its `^build` dep.
      #
      # That `^build` reaches @repo/db's `prisma generate`, whose config resolves
      # DIRECT_DATABASE_URL or throws — even though generating a client never
      # connects. There is no .env here, so hand it a placeholder: nothing in
      # this job talks to a database, and anything that tried would fail to
      # reach that host rather than find a real one. (turbo only forwards it
      # because `build` lists it in `passThroughEnv`.)
      - run: bunx turbo run typecheck test
